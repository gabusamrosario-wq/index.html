h1{font-size:17px;font-weight:700;letter-spacing:.04em;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{
  padding:5px 11px;background:var(--panel);border:0;color:var(--dim);
  font-family:inherit;font-size:12px;cursor:pointer;
}
.lang button[aria-pressed=true]{background:#24406b;color:#fff}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 18px}

/* 写真読み取り */
.shot{
  display:block;width:100%;padding:15px;margin-bottom:8px;text-align:center;
  border:1px dashed #3a4d70;border-radius:12px;background:#131c2e;
  color:var(--bar);font-size:14.5px;font-weight:700;cursor:pointer;
}
.shot:active{background:#182338}
.msg{font-size:12.5px;line-height:1.6;margin:0 0 14px;min-height:1.2em;color:var(--dim)}
.msg.ok{color:var(--bar)} .msg.ng{color:#f08a7a}

.search{position:relative;margin-bottom:14px}
input[type=text]{
  width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:16px;font-family:inherit;
}
input[type=text]:focus{outline:2px solid var(--bar);outline-offset:1px;border-color:transparent}
input[type=text]::placeholder{color:#5d6e8a}
.hits{
  position:absolute;z-index:9;left:0;right:0;top:calc(100% + 6px);
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  overflow:hidden;box-shadow:0 14px 32px rgba(0,0,0,.5);
}
.hits button{
  display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:13px 14px;background:none;border:0;color:var(--ink);
  font-family:inherit;font-size:15px;text-align:left;cursor:pointer;
}
.hits button+button{border-top:1px solid var(--line)}
.hits button:active{background:#243252}
.hits small{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}

.now{
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:12px 14px;background:var(--panel);border-radius:11px;margin-bottom:16px;
  border-left:3px solid var(--bar);
}
.now b{font-size:17px;font-weight:700}
.now span{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

.iv{display:grid;grid-template-columns:66px 1fr 34px;align-items:center;gap:12px;margin:15px 0}
.iv label{font-size:13px;color:var(--dim)}
.iv output{font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{
  height:16px;border-radius:4px;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(6.6667% - 2px),var(--field) calc(6.6667% - 2px) 6.6667%),
    linear-gradient(90deg,var(--bar) 0 var(--f),#2b3a55 var(--f) 100%);
}
input[type=range]::-moz-range-track{
  height:16px;border-radius:4px;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(6.6667% - 2px),var(--field) calc(6.6667% - 2px) 6.6667%),
    linear-gradient(90deg,var(--bar) 0 var(--f),#2b3a55 var(--f) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;margin-top:-4px;border-radius:50%;
  background:#fff;border:3px solid var(--bar);box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--bar);cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--bar);outline-offset:4px;border-radius:6px}

.tot{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--dim);font-size:12.5px;padding:12px 2px 0;margin-top:4px;
  border-top:1px solid var(--line);font-variant-numeric:tabular-nums;
}
.tot b{color:var(--ink);font-weight:700}

/* 検算 */
.vf{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:12.5px;color:var(--dim)}
.vf input{
  width:76px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:16px;font-family:inherit;
  font-variant-numeric:tabular-nums;
}
.vfmsg{font-size:12.5px;margin:8px 0 0;color:var(--dim);line-height:1.7}
.vfmsg.ok{color:var(--bar)} .vfmsg.ng{color:#f0b45a}
.cand{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.list{margin:4px 0 18px}
.sortbar{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.sortbar span{font-size:12px;color:var(--dim)}
.sortbar button{
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-family:inherit;font-size:12.5px;cursor:pointer;
}
.sortbar button[aria-pressed=true]{background:#24406b;border-color:var(--gl);color:#fff}
.row{
  display:grid;grid-template-columns:26px 1fr auto;gap:4px 10px;align-items:baseline;
  width:100%;text-align:left;padding:12px 4px;background:none;border:0;border-top:1px solid var(--line);
  color:var(--ink);font-family:inherit;cursor:pointer;
}
.row:last-child{border-bottom:1px solid var(--line)}
.row:active{background:#182338}
.row .no{font-size:13px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.row .nm2{font-size:15px;font-weight:700}
.row .cp{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .iv2{grid-column:2/4;font-size:12.5px;color:var(--bar);font-variant-numeric:tabular-nums}
.row .rk2{grid-column:2/4;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.row[aria-pressed=true]{background:#15233a}
.evo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-8px 0 16px}
.evo span{font-size:12px;color:var(--dim);margin-right:2px}
.evo button{
  padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-family:inherit;font-size:13px;cursor:pointer;
}
.evo button[aria-pressed=true]{background:#24406b;border-color:var(--gl);color:#fff}
.cand button{
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);font-family:inherit;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;
}

.caps{display:flex;gap:8px;margin:18px 0 22px}
.caps button{
  flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-family:inherit;font-size:13px;cursor:pointer;
}
.caps button[aria-pressed=true]{background:#24406b;border-color:var(--gl);color:#fff}

.lg{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 14px;
  padding:15px 0 15px 15px;border-top:1px solid var(--line);border-left:3px solid var(--c);
}
.lg:last-child{border-bottom:1px solid var(--line)}
.lg .nm{font-size:14px;font-weight:700}
.lg .meta{grid-column:1;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;margin-top:1px}
.lg .rk{
  grid-row:1/3;grid-column:2;text-align:right;
  font-size:34px;font-weight:800;line-height:1;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;color:var(--c);
}
.lg .rk i{font-size:13px;font-weight:600;font-style:normal;color:var(--dim);margin-left:3px}
.lg .na{grid-row:1/3;grid-column:2;text-align:right;color:var(--dim);font-size:13px}
.best{color:var(--dim);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}

.card{margin:6px 0 20px}
.ivread{font-size:13.5px;color:var(--bar);font-variant-numeric:tabular-nums;padding:2px 2px 14px;letter-spacing:.01em}
.manual{margin:4px 0 8px;border-top:1px solid var(--line);padding-top:10px}
.manual summary{cursor:pointer;color:var(--dim);font-size:13px;padding:6px 2px;list-style:none}
.manual summary::-webkit-details-marker{display:none}
.manual summary::before{content:"＋ ";color:var(--bar)}
.manual[open] summary::before{content:"− "}
.manual[open] summary{color:var(--ink)}
.note{color:var(--dim);font-size:11.5px;line-height:1.75;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.empty{color:var(--dim);padding:30px 0;text-align:center;font-size:13.5px}
</style>
</head>
<body>

<div class="top">
  <h1 data-t="title">個体値ランク</h1>
  <div class="lang" role="group" aria-label="Language">
    <button id="lja" aria-pressed="true">日本語</button><button id="len" aria-pressed="false">EN</button>
  </div>
</div>
<p class="sub" data-t="sub">評価画面のスクショから個体値を読み取って、各リーグの順位を出します。</p>

<label class="shot"><span data-t="shot">スクショを選ぶ</span><input type="file" id="file" accept="image/*" multiple hidden></label>
<p class="msg" id="msg"></p>
<div class="cand" id="pick"></div>
<div class="list" id="list" hidden></div>

<div class="card" id="card" hidden>
  <div class="now" id="now"></div>
  <div class="evo" id="evo" hidden></div>
  <div class="ivread" id="ivread"></div>
  <div class="caps" role="group" aria-label="強化上限">
    <button id="c50" aria-pressed="true" data-t="cap50">PL50まで（アメXLあり）</button>
    <button id="c51" aria-pressed="false" data-t="cap51">PL51（相棒ブースト）</button>
  </div>
  <div id="out"></div>
</div>

<details class="manual" id="manual">
  <summary data-t="manual">手動で調整する</summary>
  <div class="search">
    <input type="text" id="q" placeholder="ここにポケモン名を入力（例：ソーナンス）" autocomplete="off" spellcheck="false">
    <div class="hits" id="hits" hidden></div>
  </div>
  <div class="iv"><label for="ra" data-t="atk">こうげき</label><input type="range" id="ra" min="0" max="15" value="15"><output id="oa">15</output></div>
  <div class="iv"><label for="rd" data-t="def">ぼうぎょ</label><input type="range" id="rd" min="0" max="15" value="15"><output id="od">15</output></div>
  <div class="iv"><label for="rs" data-t="hpl">HP</label><input type="range" id="rs" min="0" max="15" value="15"><output id="os">15</output></div>
  <div class="tot"><span data-t="total">合計</span><span><b id="sum">45</b> / 45 &nbsp;·&nbsp; <b id="pct">100.0</b>%</span></div>
  <div class="vf">
    <span data-t="verify">検算（任意）</span>
    <input type="number" id="vcp" inputmode="numeric" placeholder="CP">
    <input type="number" id="vhp" inputmode="numeric" placeholder="HP">
  </div>
  <p class="vfmsg" id="vfmsg"></p>
  <div class="cand" id="cand"></div>
</details>

<p class="note" id="note"></p>

<script src="./pokedata.js"></script>
<script>
const CPM={1:.094,1.5:.1351374,2:.16639787,2.5:.192650919,3:.21573247,3.5:.236572661,4:.25572005,4.5:.273530381,5:.29024988,5.5:.306057377,6:.3210876,6.5:.335439132,7:.34921268,7.5:.362457751,8:.37523559,8.5:.387592416,9:.39956728,9.5:.411193551,10:.42250001,10.5:.43292642,11:.44310755,11.5:.453059958,12:.46279839,12.5:.472336083,13:.48168495,13.5:.4908558,14:.49985844,14.5:.508701765,15:.51739395,15.5:.525942511,16:.53435433,16.5:.542635767,17:.55079269,17.5:.558830576,18:.56675452,18.5:.574569153,19:.58227891,19.5:.589887917,20:.59740001,20.5:.604818814,21:.61215729,21.5:.619399365,22:.62656713,22.5:.633644533,23:.64065295,23.5:.647576426,24:.65443563,24.5:.661214806,25:.667934,25.5:.674577537,26:.68116492,26.5:.687680648,27:.69414365,27.5:.700538673,28:.70688421,28.5:.713164996,29:.71939909,29.5:.725571552,30:.7317,30.5:.734741009,31:.73776948,31.5:.740785574,32:.74378943,32.5:.746781211,33:.74976104,33.5:.752729087,34:.75568551,34.5:.758630378,35:.76156384,35.5:.764486065,36:.76739717,36.5:.770297266,37:.7731865,37.5:.776064962,38:.77893275,38.5:.781790055,39:.78463697,39.5:.787473578,40:.79030001,40.5:.792803968,41:.79530001,41.5:.797803921,42:.80030001,42.5:.802803868,43:.80530001,43.5:.807803814,44:.81030001,44.5:.81280377,45:.81530001,45.5:.81780373,46:.82030001,46.5:.822803688,47:.82530001,47.5:.827803642,48:.83030001,48.5:.832803596,49:.83530001,49.5:.837803549,50:.84029999,50.5:.842803507,51:.84529999};

function deviceLang(){
  const ls=[].concat(navigator.languages||[], navigator.language||[]);
  for(const l of ls){ const s=String(l).toLowerCase();
    if(s.startsWith('ja')) return 'ja';
    if(s.startsWith('en')) return 'en'; }
  return 'en';
}

function dispName(p){ return LANG==='ja'?p[0]:p[5]; }

  MATCH=POKE.map(p=>{
    const n=dispName(p);
    const m=LANG==='ja'?n.match(/（(.*?)）/):n.match(/\((.*?)\)/);
    const b=n.replace(LANG==='ja'?/（.*?）/g:/\s*\(.*?\)/g,'').trim();
    return m?[b,(LANG==='ja'?m[1]+b:m[1]+' '+b)]:[b];
  });
  NAMECHARS=[...new Set(MATCH.flat().join(''))].join('');
}
function applyLang(){
  buildMatch();
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=t()[el.dataset.t]; });
  $('q').placeholder=t().qph;
  $('note').innerHTML=t().note.join('<br>');
  $('lja').setAttribute('aria-pressed',LANG==='ja');
  $('len').setAttribute('aria-pressed',LANG==='en');
  if(selIdx>=0){
    const p=POKE[selIdx];
    $('now').innerHTML=`<b>${dispName(p)}</b><span>No.${p[1]} · ${t().base} ${p[2]}/${p[3]}/${p[4]}</span>`;
    renderEvo();
  }
  render(); verify();
}

/* ===== 順位計算 ===== */
function analyze(base,cap,maxLv){
  const [BA,BD,BS]=base, lv=ALL.filter(l=>l<=maxLv), rows=[];
  for(let a=0;a<16;a++)for(let d=0;d<16;d++)for(let s=0;s<16;s++){
    const at=BA+a, df=BD+d, st=BS+s, rt=Math.sqrt(df)*Math.sqrt(st)*at/10;
    let L=-1,C=0;
    for(let i=lv.length-1;i>=0;i--){
      const m=CPM[lv[i]], c=Math.max(10,Math.floor(rt*m*m));
      if(!cap||c<=cap){L=lv[i];C=c;break;}
    }
    if(L<0) continue;
    const m=CPM[L];
    rows.push({a,d,s,L,C,sp:at*m*df*m*Math.floor(st*m)});
  }
  rows.sort((x,y)=>y.sp-x.sp);
  let rank=0,prev=null;
  rows.forEach((r,i)=>{ if(r.sp!==prev){rank=i+1;prev=r.sp;} r.r=rank; });
  return rows;
}
const CACHE=new Map();
function table(base,cap,maxLv){
  const k=base.join('/')+':'+cap+':'+maxLv;
  if(!CACHE.has(k)) CACHE.set(k,analyze(base,cap,maxLv));
  return CACHE.get(k);
}

/* ===== CP・HPから候補を逆算 ===== */
function candidates(base,cp,hp){
  const [BA,BD,BS]=base, out=[];
  for(const L of ALL){
    const m=CPM[L], k=m*m/10;
    for(let s=0;s<16;s++){
      if(Math.floor((BS+s)*m)!==hp) continue;
      for(let d=0;d<16;d++){
        const q=Math.sqrt(BD+d)*Math.sqrt(BS+s)*k;
        for(let a=0;a<16;a++){
          if(Math.max(10,Math.floor((BA+a)*q))===cp) out.push({L,a,d,s});
        }
      }
    }
  }
  return out;
}

/* ===== スクショから個体値を読む ===== */
// バーの色はチーム（青・赤・黄）で変わるので、既知の色をすべて許容する
const FILLS=[[244,166,76,30],[224,126,132,24],[201,106,104,26],[248,203,80,28]];
function classify(d,i){
  const r=d[i],g=d[i+1],b=d[i+2];
  for(const f of FILLS) if(Math.abs(r-f[0])<=f[3]&&Math.abs(g-f[1])<=f[3]&&Math.abs(b-f[2])<=f[3]) return 1;
  if(Math.abs(r-227)<=14&&Math.abs(g-227)<=14&&Math.abs(b-229)<=14) return 2;
  return 0;
}
function rowRuns(cl,W,y,tol){
  const out=[]; let s=-1,p=-1;
  for(let x=0;x<W;x++){
    if(cl[y*W+x]){ if(s<0) s=x; p=x; }
    else if(s>=0 && x-p>tol){ out.push([s,p]); s=-1; }
  }
  if(s>=0) out.push([s,p]);
  return out;
}
// 行全体ではなく「連続する3つの塊」を探す（同じ行に他のUIがあっても拾える）
function triple(rs,minseg){
  let best=null,bw=0;
  for(let i=0;i+2<rs.length;i++){
    const t=[rs[i],rs[i+1],rs[i+2]];
    const w=t.map(r=>r[1]-r[0]+1);
    const mn=Math.min(...w), mx=Math.max(...w);
    if(mn<minseg||mx>mn*1.35) continue;
    const g1=t[1][0]-t[0][1], g2=t[2][0]-t[1][1];
    if(Math.max(g1,g2)>mn*0.35) continue;
    const sum=w[0]+w[1]+w[2];
    if(sum>bw){ bw=sum; best=t; }
  }
  return best;
}
function scan(cl,W,H,tol){
  const cand=[];
  for(let y=0;y<H;y++){
    const t=triple(rowRuns(cl,W,y,tol), W*0.035);
    if(t) cand.push([y,t]);
  }
  if(!cand.length) return null;
  const bands=[]; let cur=[cand[0]];
  for(let i=1;i<cand.length;i++){
    const prev=cur[cur.length-1];
    const same=Math.abs(cand[i][1][0][0]-prev[1][0][0])<W*0.02;
    if(cand[i][0]-prev[0]<=3 && same) cur.push(cand[i]);
    else { bands.push(cur); cur=[cand[i]]; }
  }
  bands.push(cur);
  const minrows=Math.max(3,Math.round(H*0.002));
  let b3=bands.filter(b=>b.length>=minrows).sort((a,b)=>a[0][0]-b[0][0]);
  if(b3.length<3) return null;
  if(b3.length>3){
    let best=null,bs=1e9;
    for(let i=0;i+2<b3.length;i++){
      const t=[b3[i],b3[i+1],b3[i+2]];
      const L=t.map(x=>x[0][1][0][0]), Y=t.map(x=>x[0][0]);
      const sc=(Math.max(...L)-Math.min(...L))/W + Math.abs((Y[1]-Y[0])-(Y[2]-Y[1]))/H*3;
      if(sc<bs){ bs=sc; best=t; }
    }
    b3=best;
  }
  const ivs=[],raw=[];
  for(const b of b3){
    // 1行だけで測ると、その行でたまたま灰色を拾えなかったときに満タンに見えてしまう。
    // 帯全体から区間の幅を決め、幅が揃っている行だけを使い、その中央値を採る。
    const wid=[0,1,2].map(i=>{
      const ws=b.map(r=>r[1][i][1]-r[1][i][0]+1).sort((x,y)=>x-y);
      return ws[Math.floor(ws.length/2)];
    });
    const rows=b.filter(r=>[0,1,2].every(i=>{
      const w=r[1][i][1]-r[1][i][0]+1;
      return Math.abs(w-wid[i])<=Math.max(2,wid[i]*0.12);
    }));
    const use=rows.length?rows:b;
    // 3区間は本来どれも同じ幅。灰色を拾い損ねて短く出た区間は、
    // 一番広い区間の幅に合わせて測り直す（そうしないと満タンに見える）
    const vals=use.map(r=>{
      const y=r[0];
      const wmax=Math.max(...r[1].map(([s,e])=>e-s+1));
      let tot=0;
      for(const [s,e] of r[1]){
        const ee=Math.min(W-1, Math.max(e, s+wmax-1));
        let n=0;
        for(let x=s;x<=ee;x++) if(cl[y*W+x]===1) n++;
        tot+=n/(ee-s+1)*5;
      }
      return tot;
    }).sort((x,y)=>x-y);
    const v=vals[Math.floor(vals.length/2)];
    raw.push(v); ivs.push(Math.max(0,Math.min(15,Math.round(v))));
  }
  return {ivs,raw};
}
function detect(img){
  const sc=Math.min(1,2800/Math.max(img.naturalWidth,img.naturalHeight));
  const W=Math.round(img.naturalWidth*sc), H=Math.round(img.naturalHeight*sc);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data, cl=new Uint8Array(W*H);
  for(let p=0,i=0;p<W*H;p++,i+=4) cl[p]=classify(d,i);
  for(const tol of [2,3,4,5,6,7]){ const r=scan(cl,W,H,tol); if(r) return r; }
  return null;
}
let RESULTS=[], SORT='sum';

function loadImg(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img); img.onerror=()=>rej(new Error('load'));
    img.src=URL.createObjectURL(file);
  });
}

async function analyzeOne(file){
  const img=await loadImg(file);
  let pack=null;
  try{ pack=prepare(img); }catch(e){}
  URL.revokeObjectURL(img.src);
  if(!pack||!pack.iv) return {err:'bar'};
  const barIVs=pack.iv.ivs, raw=pack.iv.raw;
  const out={ivs:barIVs.slice(), raw, shadow:pack.shadow,
              sum:barIVs[0]+barIVs[1]+barIVs[2],
              fuzzy:Math.max(...raw.map(v=>Math.abs(v-Math.round(v))))>0.3};
  const w=await getWorker();
  if(!w) return out;
  let hpD='', cpD='';
  try{
    await w.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:''});
    out.nm=(await w.recognize(pack.name)).data.text.replace(/[\s\u3000]/g,'');
    // 1回目で名前リストにぴったり合わなければ、単語モードでもう一度読む。
    // 単語モードは縁の線を「ー」と読みがちなので、前後の「ー」は落としてから比べる
    if(matchName(out.nm).d>0){
      await w.setParameters({tessedit_pageseg_mode:'8',tessedit_char_whitelist:NAMECHARS});
      const t2=(await w.recognize(pack.name)).data.text.replace(/[\s\u3000]/g,'').replace(/^[ー\-]+|[ー\-]+$/g,'');
      if(t2 && matchName(t2).d<matchName(out.nm).d) out.nm=t2;
      await w.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:''});
    }
    if(pack.hp){
      await w.setParameters({tessedit_char_whitelist:'0123456789/'});
      const t=(await w.recognize(pack.hp)).data.text.replace(/[^0-9/]/g,'');
      hpD=t.replace(/\//g,'');
      const head=t.split('/')[0];
      if(head && head===t.split('/')[1]) hpD=head;   // 「111/111」を素直に解釈できた場合
    }
    if(pack.cp){
      await w.setParameters({tessedit_char_whitelist:'0123456789'});
      cpD=(await w.recognize(pack.cp)).data.text.replace(/[^0-9]/g,'');
    }
  }catch(e){ return out; }
  out.hpD=hpD; out.cpD=cpD;
  if(!out.nm) return out;
  const mt=matchName(out.nm);
  if(mt.d>2){ out.unsure=true; return out; }
  out.idx=mt.idx;
  // 名前の候補が複数あっても、CPとHPが合う種族はふつう1つに絞れる
  const fix=resolveState(mt.idx, raw, hpD, cpD);
  if(fix&&fix.ambig){
    // 名前もCPも決め手にならなかった。予想CPを添えて本人に選んでもらう
    out.ambig=fix.ambig.map(x=>({idx:x.idx,ivs:x.ivs,cp:x.cp,hp:x.hp}));
    out.idx=out.ambig.map(x=>x.idx);
    return out;
  }
  if(fix){
    out.idx=[fix.idx];
    out.corrected = fix.ivs.join('-')!==barIVs.join('-');
    out.ivs=fix.ivs; out.sum=fix.ivs[0]+fix.ivs[1]+fix.ivs[2];
    out.cp=fix.cp; out.hp=fix.hp; out.level=fix.L;
    out.verified=!!fix.cpHit; out.hpOnly=!fix.cpHit;
    if(fix.cpLo!==undefined){ out.cpLo=fix.cpLo; out.cpHi=fix.cpHi; out.cp=null; }
  }else{
    // 検算できなかった場合は、名前だけで絞ってHPで補助
    let idx=mt.idx;
    const hpNum=parseInt(hpD.length%2===0?hpD.slice(0,hpD.length/2):hpD,10);
    if(hpNum){ const f2=idx.filter(i=>hpFits(POKE[i],barIVs[2],hpNum)); if(f2.length) idx=f2; }
    out.idx=idx;
    if(idx.length===1){
      const cands=cpCandidates(POKE[idx[0]],barIVs,hpNum);
      if(cands.length) out.cp=pickCP(cands,cpD);
      if(hpNum) out.hp=hpNum;
    }
  }
  return out;
}

$('file').addEventListener('change',async e=>{

function rankOf(r,cap){
  if(!r.idx||r.idx.length!==1) return null;
  const p=POKE[r.idx[0]];
  const rows=table([p[2],p[3],p[4]],cap,maxLv);
  const me=rows.find(x=>x.a===r.ivs[0]&&x.d===r.ivs[1]&&x.s===r.ivs[2]);
  return me?me.r:null;
}
function renderList(){

function prepare(img){
  const sc=Math.min(1,2800/Math.max(img.naturalWidth,img.naturalHeight));
  const W=Math.round(img.naturalWidth*sc), H=Math.round(img.naturalHeight*sc);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data, cl=new Uint8Array(W*H);
  for(let p=0,i=0;p<W*H;p++,i+=4) cl[p]=classify(d,i);
  let iv=null;
  for(const tol of [2,3,4,5,6,8,10]){ iv=scan(cl,W,H,tol); if(iv) break; }
  const g=greenBar(d,W,H);
  // UIは画面の「幅」に連動して拡大縮小するため、余白はすべてWを基準にする
  const name=g?binCanvas(d,W,H,W*0.20,g.top-W*0.0932,W*0.80,g.top-W*0.0152,160,2):null;
  const hp=g?binCanvas(d,W,H,W*0.30,g.bot+W*0.0065,W*0.70,g.bot+W*0.0585,170,2):null;
  const cp=cpCanvas(d,W,H,g);
  let pur=0,tot=0;
  for(let y=(H*0.14)|0;y<H*0.35;y++)for(let x=(W*0.20)|0;x<W*0.80;x++){
    const i=(y*W+x)*4, R=d[i],G=d[i+1],B=d[i+2]; tot++;
    if(R-G>35&&B-G>45&&B>90&&R>60) pur++;
  }
  return {iv,name,hp,cp,shadow:tot&&pur/tot>0.02};
}

/* ===== 画像から名前とHPを読む ===== */
function greenBar(d,W,H){
  let top=-1,bot=-1;
  for(let y=0;y<H;y++){
    let n=0;
    for(let x=0;x<W;x++){ const i=(y*W+x)*4;
      if(Math.abs(d[i]-103)<25&&Math.abs(d[i+1]-230)<25&&Math.abs(d[i+2]-180)<25) n++; }
    if(n>W*0.2){ if(top<0) top=y; bot=y; }
  }
  return top<0?null:{top,bot};
}
function binCanvas(d,W,H,x0,y0,x1,y1,thr,scale){
  x0=Math.max(0,x0|0); y0=Math.max(0,y0|0); x1=Math.min(W,x1|0); y1=Math.min(H,y1|0);
  const w=x1-x0, h=y1-y0;
  if(w<10||h<10) return null;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const cx=c.getContext('2d'), out=cx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=((y+y0)*W+(x+x0))*4;
    const on=(d[i]+d[i+1]+d[i+2])/3 < thr;
    const j=(y*w+x)*4, v=on?0:255;
    out.data[j]=out.data[j+1]=out.data[j+2]=v; out.data[j+3]=255;
  }
  cx.putImageData(out,0,0);
  const c2=document.createElement('canvas'); c2.width=w*scale; c2.height=h*scale;
  c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
  return c2;
}
let WORKER=null, WORKER_DEAD=false;
async function getWorker(){
  if(WORKER||WORKER_DEAD) return WORKER;
  if(typeof Tesseract==='undefined'){ WORKER_DEAD=true; return null; }
  try{
    WORKER=await Tesseract.createWorker(LANG==='ja'?'jpn':'eng',1,{
      workerPath:'./worker.min.js',
      corePath:'./',
      langPath:'./',
      gzip:false
    });
  }catch(e){ WORKER_DEAD=true; }
  return WORKER;
}
function lev(a,b){
  if(a===b) return 0;
  let prev=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]!==b[j-1]?1:0));
    prev=cur;
  }
  return prev[b.length];
}
function matchName(s){
  let best=99,out=[];
  for(let i=0;i<MATCH.length;i++){
    let d=99;
    for(const v of MATCH[i]) d=Math.min(d,lev(s,v));
    if(d<best){best=d;out=[i];} else if(d===best) out.push(i);
  }
  // ピカチュウの帽子違いのように、種族値が同じ姿は区別する意味がないので1つにまとめる
  const seenSt=new Map();
  for(const i of out){
    const k=POKE[i][2]+'/'+POKE[i][3]+'/'+POKE[i][4];
    if(!seenSt.has(k) || POKE[i][0].length<POKE[seenSt.get(k)][0].length) seenSt.set(k,i);
  }
  return {d:best,idx:[...seenSt.values()]};
}
function hpFits(p,s,hp){
  for(const L of ALL) if(Math.floor((p[4]+s)*CPM[L])===hp) return true;
  return false;
}

/* ===== CPを読む（逆算した候補から選ぶ方式） ===== */
function lightMask(d,W,H,x0,y0,x1,y1,thr){
  x0=Math.max(0,x0|0); y0=Math.max(0,y0|0); x1=Math.min(W,x1|0); y1=Math.min(H,y1|0);
  const w=x1-x0, h=y1-y0;
  if(w<10||h<10) return null;
  const m=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=((y+y0)*W+(x+x0))*4;
    m[y*w+x] = (Math.min(d[i],d[i+1],d[i+2])>thr)?1:0;
  }
  return {m,w,h,x0,y0};
}
function colRuns(M){
  const {m,w,h}=M, out=[];
  let s=-1,p=-1;
  for(let x=0;x<w;x++){
    let on=0; for(let y=0;y<h;y++) if(m[y*w+x]){on=1;break;}
    if(on){ if(s<0) s=x; p=x; }
    else if(s>=0 && x-p>6){ out.push([s,p]); s=-1; }
  }
  if(s>=0) out.push([s,p]);
  return out.map(([a,b])=>{
    let t=h,bt=-1,n=0;
    for(let y=0;y<h;y++)for(let x=a;x<=b;x++) if(m[y*w+x]){ n++; if(y<t)t=y; if(y>bt)bt=y; }
    return [a,b,t,bt,n];
  }).filter(r=>r[4]>=12);
}
function cpCanvas(d,W,H,g){
  // CPは画面上部。緑バーより上の範囲だけを見て、時計などを拾わないよう横幅も絞る
  const yEnd=Math.min(H*0.22, g?g.top*0.30:H*0.22);
  const M=lightMask(d,W,H,W*0.18,0,W*0.82,yEnd,230);
  if(!M) return null;
  // CPの数字の高さはおよそ画面幅の6%。掛け離れたものは除く
  let rs=colRuns(M).filter(r=>{const hh=r[3]-r[2]+1; return hh>W*0.030 && hh<W*0.095;});
  if(!rs.length) return null;
  const hmax=Math.max(...rs.map(r=>r[3]-r[2]+1));
  rs=rs.filter(r=>(r[3]-r[2]+1)>=hmax*0.75);
  if(!rs.length) return null;
  const a0=Math.max(0,Math.min(...rs.map(r=>r[0]))-6), a1=Math.min(M.w,Math.max(...rs.map(r=>r[1]))+7);
  const b0=Math.max(0,Math.min(...rs.map(r=>r[2]))-4), b1=Math.min(M.h,Math.max(...rs.map(r=>r[3]))+5);
  const w=a1-a0, hh=b1-b0;
  const c=document.createElement('canvas'); c.width=w; c.height=hh;
  const cx=c.getContext('2d'), out=cx.createImageData(w,hh);
  for(let y=0;y<hh;y++)for(let x=0;x<w;x++){
    const v=M.m[(y+b0)*M.w+(x+a0)]?0:255, j=(y*w+x)*4;
    out.data[j]=out.data[j+1]=out.data[j+2]=v; out.data[j+3]=255;
  }
  cx.putImageData(out,0,0);
  const c2=document.createElement('canvas'); c2.width=w*3; c2.height=hh*3;
  c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
  return c2;
}
function cpCandidates(p,ivs,hp){
  const [a,d,s]=ivs, set=new Set();
  for(const L of ALL){
    const m=CPM[L];
    if(Math.floor((p[4]+s)*m)!==hp) continue;
    set.add(Math.max(10,Math.floor((p[2]+a)*Math.sqrt(p[3]+d)*Math.sqrt(p[4]+s)*m*m/10)));
  }
  return [...set].sort((x,y)=>x-y);
}
function pickCP(cands,txt){
  if(!cands.length) return null;
  if(cands.length===1) return cands[0];
  if(!txt) return cands[Math.floor(cands.length/2)];
  let best=cands[0], bs=1e9;
  for(const c of cands){
    const sc=lev(txt,String(c))*10+Math.abs(String(c).length-txt.length);
    if(sc<bs){bs=sc;best=c;}
  }
  return best;
}

/* ===== 読み取り結果の相互検算 =====
   バー・CP・HPは互いに独立した読み取りなので、
   「この種族で実際に存在しうる状態」の中から一番つじつまの合うものを選ぶ */
function numMatch(v,digits){
  if(!digits) return 0;
  const s=String(v);
  if(digits===s || digits===s+s) return 2;   // 完全一致
  if(digits.indexOf(s)>=0) return 1;         // 正解がOCR文字列に含まれる（余計な文字の混入）
  return 0;
}
function resolveState(idxList, raw, hpD, cpD){
  if(!idxList||!idxList.length) return null;
  const lo=raw.map(v=>Math.max(0,Math.round(v)-2));
  const hi=raw.map(v=>Math.min(15,Math.round(v)+2));
  let best=null, ties=[];
  const bySp=new Map();   // 種族ごとの最良の状態
  for(const idx of idxList){
    const p=POKE[idx], BA=p[2], BD=p[3], BS=p[4];
    for(let a=lo[0];a<=hi[0];a++)
    for(let d=lo[1];d<=hi[1];d++)
    for(let s=lo[2];s<=hi[2];s++){
      const ivd=Math.abs(raw[0]-a)+Math.abs(raw[1]-d)+Math.abs(raw[2]-s);
      if(ivd>4.5) continue;
      const rt=(BA+a)*Math.sqrt(BD+d)*Math.sqrt(BS+s)/10;
      for(const L of ALL){
        const m=CPM[L];
        const hp=Math.floor((BS+s)*m);
        const cp=Math.max(10,Math.floor(rt*m*m));
        const cpHit=numMatch(cp,cpD);
        const w=numMatch(hp,hpD)+cpHit;
        if(w<2) continue;                      // 少なくとも片方が確かに合うこと
        const sc=-w*10+ivd;
        const prev=bySp.get(idx);
        if(!prev||sc<prev.sc-1e-9) bySp.set(idx,{sc,idx,ivs:[a,d,s],cp,hp,L,cpHit});
        if(!best||sc<best.sc-1e-9){ best={sc,idx,ivs:[a,d,s],cp,hp,L,w}; ties=[best]; }
        else if(Math.abs(sc-best.sc)<1e-9) ties.push({sc,idx,ivs:[a,d,s],cp,hp,L,w});
      }
    }
  }
  if(!best) return null;
  best.cpHit=numMatch(best.cp,cpD);
  // 別の種族でも同じくらい辻褄が合うなら、ここで決めつけない。
  // CPが合っていない（HPだけで照合した）ときは、個体値のずれ1以内まで候補に含める。
  const margin=best.cpHit?1e-9:1.0;
  const rivals=[...bySp.values()].filter(x=>x.sc<=best.sc+margin).sort((x,y)=>x.sc-y.sc);
  if(rivals.length>1 && cpD && cpD.length>=2){
    const f=rivals.filter(x=>{const s=String(x.cp); return s.includes(cpD)||cpD.includes(s);});
    if(f.length===1) return Object.assign(f[0],{cpHit:1});
  }
  if(rivals.length>1) return {ambig:rivals};
  // 同点が残る場合（CPが読めずHPだけで絞れた等）はCPの幅を示す
  if(ties.length>1){
    const same=ties.filter(x=>x.idx===best.idx && x.ivs.join()===best.ivs.join());
    const cps=[...new Set(same.map(x=>x.cp))].sort((x,y)=>x-y);
    if(cps.length>1){
      // CPが読めずHPだけでは強化レベルを1つに絞れない。当てずっぽうで決めず幅で示す
      best=same[0]; best.cpLo=cps[0]; best.cpHi=cps[cps.length-1];
    }
  }
  return best;
}

/* ===== 検索 ===== */
let sel=null, maxLv=50, rootIdx=-1, selIdx=-1;
$('q').addEventListener('input',e=>{
  const t=e.target.value.trim().toLowerCase(), h=$('hits');
  if(!t){h.hidden=true;return;}
  const num=/^\d+$/.test(t);
  const r=[];
  for(let i=0;i<POKE.length&&r.length<8;i++){
    const p=POKE[i];
    if(num?String(p[1])===t:(p[0].toLowerCase().includes(t)||p[5].toLowerCase().includes(t))) r.push(i);
  }
  if(!r.length){h.hidden=true;return;}
  h.innerHTML=r.map(i=>`<button type="button" data-i="${i}">${dispName(POKE[i])}<small>No.${POKE[i][1]}</small></button>`).join('');
  h.hidden=false;
});
function chainOf(i){
  const acc=[i];
  (function walk(k){ for(const j of (POKE[k][7]||[])) if(acc.indexOf(j)<0){acc.push(j); walk(j);} })(i);
  return acc;
}
function renderEvo(){
  const e=$('evo'), ch=chainOf(rootIdx);
  if(ch.length<2){ e.hidden=true; e.innerHTML=''; return; }
  e.hidden=false;
  e.innerHTML=`<span>${t().evo}</span>`+ch.map(i=>
    `<button data-i="${i}" aria-pressed="${i===selIdx}">${dispName(POKE[i])}</button>`).join('');
}
function selectPoke(i,keepRoot){
  if(!keepRoot) rootIdx=i;
  selIdx=i; sel=POKE[i];
  $('q').value=''; $('hits').hidden=true; $('now').hidden=false;
  $('now').innerHTML=`<b>${dispName(sel)}</b><span>No.${sel[1]} · ${t().base} ${sel[2]}/${sel[3]}/${sel[4]}</span>`;
  $('card').hidden=false;
  renderEvo(); render(); verify();
}
$('evo').addEventListener('click',e=>{
  const b=e.target.closest('button[data-i]'); if(b) selectPoke(+b.dataset.i,true);
});
$('hits').addEventListener('click',e=>{
  const d=e.target.closest('button[data-i]'); if(!d) return;
  selectPoke(+d.dataset.i);
});
$('pick').addEventListener('click',e=>{
  const d=e.target.closest('button[data-i]'); if(!d) return;
  $('pick').innerHTML='';
  if(d.dataset.iv){
    setIVs(d.dataset.iv.split('-').map(Number));
    $('vcp').value=d.dataset.cp||''; $('vhp').value=d.dataset.hp||'';
    // 一覧から来た場合は、その行の結果も確定させる
    const r=RESULTS[selIdxRow];
    if(r&&r.ambig){
      const x=r.ambig.find(z=>String(z.idx)===d.dataset.i);
      Object.assign(r,{idx:[x.idx],ivs:x.ivs,cp:x.cp,hp:x.hp,sum:x.ivs[0]+x.ivs[1]+x.ivs[2],ambig:null});
      renderList();
    }
    $('msg').className='msg ok'; $('msg').textContent='';
  }
  selectPoke(+d.dataset.i);
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) $('hits').hidden=true; });

/* ===== スライダー ===== */
['a','d','s'].forEach(k=>{
  const r=$('r'+k);
  const upd=()=>{
    $('o'+k).textContent=r.value;
    r.style.setProperty('--f',(r.value/15*100)+'%');

applyLang();

function setLang(v){
  if(v===LANG) return;
  LANG=v;
  if(WORKER){ try{WORKER.terminate()}catch(e){} WORKER=null; WORKER_DEAD=false; }
  $('msg').textContent=''; $('msg').className='msg'; $('pick').innerHTML='';
  applyLang(); renderList();
}
$('c50').onclick=()=>setCap(50); $('c51').onclick=()=>setCap(51);
function setCap(v){
  maxLv=v; $('c50').setAttribute('aria-pressed',v===50); $('c51').setAttribute('aria-pressed',v===51);
  render(); renderList();
}

/* ===== 検算 ===== */
$('vcp').addEventListener('input',verify); $('vhp').addEventListener('input',verify);
$('cand').addEventListener('click',e=>{
  const b=e.target.closest('button[data-iv]'); if(!b) return;
  const v=b.dataset.iv.split('-');
  ['a','d','s'].forEach((k,i)=>{ const el=$('r'+k); el.value=v[i]; el.dispatchEvent(new Event('input')); });
});
function verify(){
  const box=$('vfmsg'), cd=$('cand');
  const cp=parseInt($('vcp').value,10), hp=parseInt($('vhp').value,10);
  cd.innerHTML='';
  if(!sel||!cp||!hp||selIdx!==rootIdx){ box.className='vfmsg'; box.textContent=''; return; }
  const a=+$('ra').value, d=+$('rd').value, s=+$('rs').value;
  const list=candidates([sel[2],sel[3],sel[4]],cp,hp);
  if(!list.length){ box.className='vfmsg ng'; box.textContent=t().vfNone; return; }
  const hit=list.find(x=>x.a===a&&x.d===d&&x.s===s);
  if(hit){ box.className='vfmsg ok'; box.textContent=t().vfOk(hit.L); return; }
  box.className='vfmsg ng';
  box.textContent=t().vfNg;
  // 今読めている個体値に近い順に並べる（バーの誤読はふつう±1なので上位に来る）
  const uniq=[...new Map(list.map(x=>[x.a+'-'+x.d+'-'+x.s,x])).values()]
    .sort((x,y)=>(Math.abs(x.a-a)+Math.abs(x.d-d)+Math.abs(x.s-s))
                -(Math.abs(y.a-a)+Math.abs(y.d-d)+Math.abs(y.s-s)))
    .slice(0,10);
  cd.innerHTML=uniq.map(x=>`<button data-iv="${x.a}-${x.d}-${x.s}">${x.a}-${x.d}-${x.s}</button>`).join('');
}

/* ===== 描画 ===== */
function render(){
  if(!sel){ $('card').hidden=true; return; }
  const base=[sel[2],sel[3],sel[4]];
  const a=+$('ra').value, d=+$('rd').value, s=+$('rs').value;
  let html='';
  for(const lg of LEAGUES){
    if(lg.cap===500 && !sel[6]) continue;
    const rows=table(base,lg.cap,maxLv);
    const me=rows.find(r=>r.a===a&&r.d===d&&r.s===s), top=rows[0];
    const nm=t().leagues[LEAGUES.indexOf(lg)];
    if(!me){
      html+=`<div class="lg" style="--c:${lg.c}"><div class="nm">${nm}</div>
        <div class="meta">${t().over(lg.cap)}</div><div class="na">—</div></div>`;
      continue;
    }
    html+=`<div class="lg" style="--c:${lg.c}">
      <div class="nm">${nm}${t().capNote(lg.cap)}</div>
      <div class="meta">${t().meta(me.L,me.C,(me.sp/top.sp*100).toFixed(1))}</div>
      <div class="rk">${t().rankBig(me.r)}<i>${t().rankSuf}${rows.length<4096?t().outOf(rows.length):''}</i></div>
      <div class="best" style="grid-column:1/3">${t().best(top.a+'-'+top.d+'-'+top.s,top.L,top.C)}</div>
    </div>`;
  }
  $('out').innerHTML=html;
}
