}
.lang button[aria-pressed=true]{background:#24406b;color:#fff}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 18px}

/* 写真読み取り */
.shot{
  display:block;width:100%;padding:15px;margin-bottom:8px;text-align:center;
  border:1px dashed #3a4d70;border-radius:12px;background:#131c2e;
  color:var(--bar);font-size:14.5px;font-weight:700;cursor:pointer;
}
.shot:active{background:#182338}
.msg{font-size:12.5px;line-height:1.6;margin:0 0 14px;min-height:1.2em;color:var(--dim)}
.msg.ok{color:var(--bar)} .msg.ng{color:#f08a7a}

.search{position:relative;margin-bottom:14px}
input[type=text]{
  width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:16px;font-family:inherit;
}
input[type=text]:focus{outline:2px solid var(--bar);outline-offset:1px;border-color:transparent}
input[type=text]::placeholder{color:#5d6e8a}
.hits{
  position:absolute;z-index:9;left:0;right:0;top:calc(100% + 6px);
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  overflow:hidden;box-shadow:0 14px 32px rgba(0,0,0,.5);
}
.hits button{
  display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:13px 14px;background:none;border:0;color:var(--ink);
  font-family:inherit;font-size:15px;text-align:left;cursor:pointer;
}
.hits button+button{border-top:1px solid var(--line)}
.hits button:active{background:#243252}
.hits small{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}

.now{
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:12px 14px;background:var(--panel);border-radius:11px;margin-bottom:16px;
  border-left:3px solid var(--bar);
}
.now b{font-size:17px;font-weight:700}
.now span{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

.iv{display:grid;grid-template-columns:66px 1fr 34px;align-items:center;gap:12px;margin:15px 0}
.iv label{font-size:13px;color:var(--dim)}
.iv output{font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{
  height:16px;border-radius:4px;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(6.6667% - 2px),var(--field) calc(6.6667% - 2px) 6.6667%),
    linear-gradient(90deg,var(--bar) 0 var(--f),#2b3a55 var(--f) 100%);
}
input[type=range]::-moz-range-track{
  height:16px;border-radius:4px;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(6.6667% - 2px),var(--field) calc(6.6667% - 2px) 6.6667%),
    linear-gradient(90deg,var(--bar) 0 var(--f),#2b3a55 var(--f) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;margin-top:-4px;border-radius:50%;
  background:#fff;border:3px solid var(--bar);box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--bar);cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--bar);outline-offset:4px;border-radius:6px}

.tot{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--dim);font-size:12.5px;padding:12px 2px 0;margin-top:4px;
  border-top:1px solid var(--line);font-variant-numeric:tabular-nums;
}
.tot b{color:var(--ink);font-weight:700}

/* 検算 */
.vf{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:12.5px;color:var(--dim)}
.vf input{
  width:76px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:16px;font-family:inherit;
  font-variant-numeric:tabular-nums;
}
.vfmsg{font-size:12.5px;margin:8px 0 0;color:var(--dim);line-height:1.7}
.vfmsg.ok{color:var(--bar)} .vfmsg.ng{color:#f0b45a}
.cand{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.evo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-8px 0 16px}
.evo span{font-size:12px;color:var(--dim);margin-right:2px}
.evo button{
  padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-family:inherit;font-size:13px;cursor:pointer;
}
.evo button[aria-pressed=true]{background:#24406b;border-color:var(--gl);color:#fff}
.cand button{
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);font-family:inherit;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;
}

.caps{display:flex;gap:8px;margin:18px 0 22px}
.caps button{
  flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-family:inherit;font-size:13px;cursor:pointer;
}
.caps button[aria-pressed=true]{background:#24406b;border-color:var(--gl);color:#fff}

.lg{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 14px;
  padding:15px 0 15px 15px;border-top:1px solid var(--line);border-left:3px solid var(--c);
}
.lg:last-child{border-bottom:1px solid var(--line)}
.lg .nm{font-size:14px;font-weight:700}
.lg .meta{grid-column:1;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;margin-top:1px}
.lg .rk{
  grid-row:1/3;grid-column:2;text-align:right;
  font-size:34px;font-weight:800;line-height:1;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;color:var(--c);
}
.lg .rk i{font-size:13px;font-weight:600;font-style:normal;color:var(--dim);margin-left:3px}
.lg .na{grid-row:1/3;grid-column:2;text-align:right;color:var(--dim);font-size:13px}
.best{color:var(--dim);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}

.note{color:var(--dim);font-size:11.5px;line-height:1.75;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.empty{color:var(--dim);padding:30px 0;text-align:center;font-size:13.5px}
</style>
</head>

/* ===== 順位計算 ===== */
function analyze(base,cap,maxLv){
  const [BA,BD,BS]=base, lv=ALL.filter(l=>l<=maxLv), rows=[];
  for(let a=0;a<16;a++)for(let d=0;d<16;d++)for(let s=0;s<16;s++){
    const at=BA+a, df=BD+d, st=BS+s, rt=Math.sqrt(df)*Math.sqrt(st)*at/10;
    let L=-1,C=0;
    for(let i=lv.length-1;i>=0;i--){
      const m=CPM[lv[i]], c=Math.max(10,Math.floor(rt*m*m));
      if(!cap||c<=cap){L=lv[i];C=c;break;}
    }
    if(L<0) continue;
    const m=CPM[L];
    rows.push({a,d,s,L,C,sp:at*m*df*m*Math.floor(st*m)});
  }
  rows.sort((x,y)=>y.sp-x.sp);
  let rank=0,prev=null;
  rows.forEach((r,i)=>{ if(r.sp!==prev){rank=i+1;prev=r.sp;} r.r=rank; });
  return rows;
}
const CACHE=new Map();
function table(base,cap,maxLv){
  const k=base.join('/')+':'+cap+':'+maxLv;
  if(!CACHE.has(k)) CACHE.set(k,analyze(base,cap,maxLv));
  return CACHE.get(k);
}

/* ===== CP・HPから候補を逆算 ===== */
function candidates(base,cp,hp){
  const [BA,BD,BS]=base, out=[];
  for(const L of ALL){
    const m=CPM[L], k=m*m/10;
    for(let s=0;s<16;s++){
      if(Math.floor((BS+s)*m)!==hp) continue;
      for(let d=0;d<16;d++){
        const q=Math.sqrt(BD+d)*Math.sqrt(BS+s)*k;
        for(let a=0;a<16;a++){
          if(Math.max(10,Math.floor((BA+a)*q))===cp) out.push({L,a,d,s});
        }
      }
    }
  }
  return out;
}

const FILLS=[[244,166,76,26],[224,126,132,22]];  // 通常の塗り / 個体値15の赤
function classify(d,i){
  const r=d[i],g=d[i+1],b=d[i+2];
  for(const f of FILLS) if(Math.abs(r-f[0])<=f[3]&&Math.abs(g-f[1])<=f[3]&&Math.abs(b-f[2])<=f[3]) return 1;
  if(Math.abs(r-226)<=10&&Math.abs(g-226)<=10&&Math.abs(b-228)<=10) return 2;
  return 0;
}
function rowRuns(cl,W,y,tol,minseg){
  const out=[]; let s=-1,p=-1;
  for(let x=0;x<W;x++){
    if(cl[y*W+x]){
      if(s<0){s=x;} else if(x-p>tol){ if(p-s>=minseg) out.push([s,p]); s=x; }
      p=x;
    }
  }
  if(s>=0&&p-s>=minseg) out.push([s,p]);
  return out;
}
function scan(cl,W,H,tol){
  const minseg=W*0.05, cand=[];
  for(let y=0;y<H;y++){
    const rs=rowRuns(cl,W,y,tol,minseg);
    if(rs.length!==3) continue;
    const w=rs.map(r=>r[1]-r[0]+1);
    if(Math.max(...w)>Math.min(...w)*1.25) continue;
    const g=[rs[1][0]-rs[0][1],rs[2][0]-rs[1][1]];
    if(Math.max(...g)>Math.min(...w)*0.25) continue;
    cand.push([y,rs]);
  }
  if(!cand.length) return null;
  const bands=[]; let cur=[cand[0]];
  for(let i=1;i<cand.length;i++){
    if(cand[i][0]-cur[cur.length-1][0]<=3) cur.push(cand[i]);
    else{bands.push(cur);cur=[cand[i]];}
  }
  bands.push(cur);
  const b3=bands.filter(b=>b.length>=6);
  if(b3.length!==3) return null;
  const ivs=[],raw=[];
  for(const b of b3){
    const [y,rs]=b[Math.floor(b.length/2)];
    let t=0;
    for(const [s,e] of rs){
      let n=0;
      for(let x=s;x<=e;x++) if(cl[y*W+x]===1) n++;
      t+=n/(e-s+1)*5;
    }
    raw.push(t); ivs.push(Math.max(0,Math.min(15,Math.round(t))));
  }
  return {ivs,raw};
}
function detect(img){
  const sc=Math.min(1,2800/Math.max(img.naturalWidth,img.naturalHeight));
  const W=Math.round(img.naturalWidth*sc), H=Math.round(img.naturalHeight*sc);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data, cl=new Uint8Array(W*H);
  for(let p=0,i=0;p<W*H;p++,i+=4) cl[p]=classify(d,i);
  for(const tol of [2,3,4,5,6,7]){ const r=scan(cl,W,H,tol); if(r) return r; }
  return null;
}

function prepare(img){
  const sc=Math.min(1,2800/Math.max(img.naturalWidth,img.naturalHeight));
  const W=Math.round(img.naturalWidth*sc), H=Math.round(img.naturalHeight*sc);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data, cl=new Uint8Array(W*H);
  for(let p=0,i=0;p<W*H;p++,i+=4) cl[p]=classify(d,i);
  let iv=null;
  for(const tol of [2,3,4,5,6,7]){ iv=scan(cl,W,H,tol); if(iv) break; }
  const g=greenBar(d,W,H);
  const name=g?binCanvas(d,W,H,W*0.20,g.top-H*0.043,W*0.80,g.top-H*0.007,160,2):null;
  const hp=g?binCanvas(d,W,H,W*0.30,g.bot+H*0.003,W*0.70,g.bot+H*0.027,170,2):null;
  let pur=0,tot=0;
  for(let y=(H*0.14)|0;y<H*0.35;y++)for(let x=(W*0.20)|0;x<W*0.80;x++){
    const i=(y*W+x)*4, R=d[i],G=d[i+1],B=d[i+2]; tot++;
    if(R-G>35&&B-G>45&&B>90&&R>60) pur++;
  }
  return {iv,name,hp,shadow:tot&&pur/tot>0.02};
}

/* ===== 画像から名前とHPを読む ===== */
function greenBar(d,W,H){
  let top=-1,bot=-1;
  for(let y=0;y<H;y++){
    let n=0;
    for(let x=0;x<W;x++){ const i=(y*W+x)*4;
      if(Math.abs(d[i]-103)<25&&Math.abs(d[i+1]-230)<25&&Math.abs(d[i+2]-180)<25) n++; }
    if(n>W*0.2){ if(top<0) top=y; bot=y; }
  }
  return top<0?null:{top,bot};
}
function binCanvas(d,W,H,x0,y0,x1,y1,thr,scale){
  x0=Math.max(0,x0|0); y0=Math.max(0,y0|0); x1=Math.min(W,x1|0); y1=Math.min(H,y1|0);
  const w=x1-x0, h=y1-y0;
  if(w<10||h<10) return null;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const cx=c.getContext('2d'), out=cx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=((y+y0)*W+(x+x0))*4;
    const on=(d[i]+d[i+1]+d[i+2])/3 < thr;
    const j=(y*w+x)*4, v=on?0:255;
    out.data[j]=out.data[j+1]=out.data[j+2]=v; out.data[j+3]=255;
  }
  cx.putImageData(out,0,0);
  const c2=document.createElement('canvas'); c2.width=w*scale; c2.height=h*scale;
  c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
  return c2;
}
let WORKER=null, WORKER_DEAD=false;
async function getWorker(){
  if(WORKER||WORKER_DEAD) return WORKER;
  if(typeof Tesseract==='undefined'){ WORKER_DEAD=true; return null; }
  try{
    WORKER=await Tesseract.createWorker(LANG==='ja'?'jpn':'eng',1,{
      langPath:'https://cdn.jsdelivr.net/gh/tesseract-ocr/tessdata_fast@main',
      gzip:false
    });
  }catch(e){ WORKER_DEAD=true; }
  return WORKER;
}
function lev(a,b){
  if(a===b) return 0;
  let prev=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]!==b[j-1]?1:0));
    prev=cur;
  }
  return prev[b.length];
}
function matchName(s){
  let best=99,out=[];
  for(let i=0;i<MATCH.length;i++){
    let d=99;
    for(const v of MATCH[i]) d=Math.min(d,lev(s,v));
    if(d<best){best=d;out=[i];} else if(d===best) out.push(i);
  }
  return {d:best,idx:out};
}
function hpFits(p,s,hp){
  for(const L of ALL) if(Math.floor((p[4]+s)*CPM[L])===hp) return true;
  return false;
}

/* ===== 検索 ===== */
let sel=null, maxLv=50, rootIdx=-1, selIdx=-1;
$('q').addEventListener('input',e=>{
  const t=e.target.value.trim().toLowerCase(), h=$('hits');
  if(!t){h.hidden=true;return;}
  const num=/^\d+$/.test(t);
  const r=[];
  for(let i=0;i<POKE.length&&r.length<8;i++){
    const p=POKE[i];
    if(num?String(p[1])===t:(p[0].toLowerCase().includes(t)||p[5].toLowerCase().includes(t))) r.push(i);
  }
  if(!r.length){h.hidden=true;return;}
  h.innerHTML=r.map(i=>`<button type="button" data-i="${i}">${dispName(POKE[i])}<small>No.${POKE[i][1]}</small></button>`).join('');
  h.hidden=false;
});
function chainOf(i){
  const acc=[i];
  (function walk(k){ for(const j of (POKE[k][7]||[])) if(acc.indexOf(j)<0){acc.push(j); walk(j);} })(i);
  return acc;
}
function renderEvo(){
  const e=$('evo'), ch=chainOf(rootIdx);
  if(ch.length<2){ e.hidden=true; e.innerHTML=''; return; }
  e.hidden=false;
  e.innerHTML=`<span>${t().evo}</span>`+ch.map(i=>
    `<button data-i="${i}" aria-pressed="${i===selIdx}">${dispName(POKE[i])}</button>`).join('');
}
function selectPoke(i,keepRoot){
  if(!keepRoot) rootIdx=i;
  selIdx=i; sel=POKE[i];
  $('q').value=''; $('hits').hidden=true; $('now').hidden=false;
  $('now').innerHTML=`<b>${dispName(sel)}</b><span>No.${sel[1]} · ${t().base} ${sel[2]}/${sel[3]}/${sel[4]}</span>`;
  renderEvo(); render(); verify();
}
$('evo').addEventListener('click',e=>{
  const b=e.target.closest('button[data-i]'); if(b) selectPoke(+b.dataset.i,true);
});
$('hits').addEventListener('click',e=>{
  const d=e.target.closest('button[data-i]'); if(!d) return;
  selectPoke(+d.dataset.i);
});
$('pick').addEventListener('click',e=>{
  const d=e.target.closest('button[data-i]'); if(!d) return;
  $('pick').innerHTML=''; selectPoke(+d.dataset.i);
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) $('hits').hidden=true; });

/* ===== スライダー ===== */
['a','d','s'].forEach(k=>{
  const r=$('r'+k);
  const upd=()=>{
    $('o'+k).textContent=r.value;
    r.style.setProperty('--f',(r.value/15*100)+'%');
    const t=+$('ra').value + +$('rd').value + +$('rs').value;
    $('sum').textContent=t; $('pct').textContent=(t/45*100).toFixed(1);
    render(); verify();
  };
  r.addEventListener('input',upd); upd();
});
applyLang();
$('lja').onclick=()=>setLang('ja'); $('len').onclick=()=>setLang('en');
function setLang(v){
  if(v===LANG) return;
  LANG=v;
  if(WORKER){ try{WORKER.terminate()}catch(e){} WORKER=null; WORKER_DEAD=false; }
  $('msg').textContent=''; $('msg').className='msg'; $('pick').innerHTML='';
  applyLang();
}
$('c50').onclick=()=>setCap(50); $('c51').onclick=()=>setCap(51);
function setCap(v){
  maxLv=v; $('c50').setAttribute('aria-pressed',v===50); $('c51').setAttribute('aria-pressed',v===51);
  render();
}

/* ===== 検算 ===== */
$('vcp').addEventListener('input',verify); $('vhp').addEventListener('input',verify);
$('cand').addEventListener('click',e=>{
  const b=e.target.closest('button[data-iv]'); if(!b) return;
  const v=b.dataset.iv.split('-');
  ['a','d','s'].forEach((k,i)=>{ const el=$('r'+k); el.value=v[i]; el.dispatchEvent(new Event('input')); });
});
function verify(){
  const box=$('vfmsg'), cd=$('cand');
  const cp=parseInt($('vcp').value,10), hp=parseInt($('vhp').value,10);
  cd.innerHTML='';
  if(!sel||!cp||!hp||selIdx!==rootIdx){ box.className='vfmsg'; box.textContent=''; return; }
  const a=+$('ra').value, d=+$('rd').value, s=+$('rs').value;
  const list=candidates([sel[2],sel[3],sel[4]],cp,hp);
  if(!list.length){ box.className='vfmsg ng'; box.textContent=t().vfNone; return; }
  const hit=list.find(x=>x.a===a&&x.d===d&&x.s===s);
  if(hit){ box.className='vfmsg ok'; box.textContent=t().vfOk(hit.L); return; }
  box.className='vfmsg ng';
  box.textContent=t().vfNg;
  const uniq=[...new Map(list.map(x=>[x.a+'-'+x.d+'-'+x.s,x])).values()].slice(0,10);
  cd.innerHTML=uniq.map(x=>`<button data-iv="${x.a}-${x.d}-${x.s}">${x.a}-${x.d}-${x.s}</button>`).join('');
}

/* ===== 描画 ===== */
function render(){
  if(!sel) return;
  const base=[sel[2],sel[3],sel[4]];
  const a=+$('ra').value, d=+$('rd').value, s=+$('rs').value;
  let html='';
  for(const lg of LEAGUES){
    if(lg.cap===500 && !sel[6]) continue;
    const rows=table(base,lg.cap,maxLv);
    const me=rows.find(r=>r.a===a&&r.d===d&&r.s===s), top=rows[0];
    const nm=t().leagues[LEAGUES.indexOf(lg)];
    if(!me){
      html+=`<div class="lg" style="--c:${lg.c}"><div class="nm">${nm}</div>
        <div class="meta">${t().over(lg.cap)}</div><div class="na">—</div></div>`;
      continue;
    }
    html+=`<div class="lg" style="--c:${lg.c}">
      <div class="nm">${nm}${t().capNote(lg.cap)}</div>
      <div class="meta">${t().meta(me.L,me.C,(me.sp/top.sp*100).toFixed(1))}</div>
      <div class="rk">${t().rankBig(me.r)}<i>${t().rankSuf}${rows.length<4096?t().outOf(rows.length):''}</i></div>
      <div class="best" style="grid-column:1/3">${t().best(top.a+'-'+top.d+'-'+top.s,top.L,top.C)}</div>
    </div>`;
  }
  $('out').innerHTML=html;
}
</script>
