name: ポケモンデータの自動更新

on:
  schedule:
    - cron: '17 18 * * *'   # 毎日 日本時間 3:17
  workflow_dispatch:         # Actions画面から手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: データを作り直す
        run: python3 scripts/build_data.py pokedata.js
      - name: 変化があればコミット
        run: |
          if git diff --quiet -- pokedata.js; then
            echo "変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add pokedata.js
            git commit -m "ポケモンデータを自動更新"
            git push
          fi
